# Publish the plugin to the public npm registry when a GitHub Release is
# published. Beta releases go to the `next` dist-tag so that `latest` always
# points at a stable version.
#
# Auth is npm trusted publishing (OIDC) — no NPM_TOKEN secret exists anywhere.
# GitHub mints a short-lived token per run, pnpm exchanges it for a publish
# credential, and the npm registry verifies the trusted publisher below.
#
# Setup (one time, on npmjs.com):
#   Package page > Settings > Trusted publishing > Add trusted publisher:
#     Provider           GitHub Actions
#     Organization       coldgust
#     Repository         dsh-translation-assistant
#     Workflow filename  npm-publish.yml        <- filename only, must match this file
#     Environment        (leave empty)
#     Allowed actions    tick "Allow npm publish" (configs created after
#                        2026-09-03 default to staged publishing only)
#   All fields are case-sensitive and npm does not validate them on save, so a
#   typo only surfaces as ENEEDAUTH during a release. The first publish must
#   succeed within 2 days of creating the config or it expires.
#
# Provenance is attached automatically: OIDC + public repo + public package.
# (A private repository would drop provenance, so keep this repo public.)

name: Publish to npm

on:
  release:
    types: [published]
  # Manual escape hatch: re-publish the current commit under a chosen dist-tag.
  workflow_dispatch:
    inputs:
      tag:
        description: Dist-tag to publish under
        type: choice
        default: next
        options: [next, latest]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required: lets the job request the OIDC token npm exchanges
    steps:
      - uses: actions/checkout@v4
        with:
          # Publish exactly the tagged commit, not whatever main has moved to.
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      # v6 exposes `package-manager-cache`; keep it off because release builds
      # are not reproducible from a warm cache.
      - uses: actions/setup-node@v6
        with:
          node-version: 24 # runs the build, tests and the version check
          registry-url: https://registry.npmjs.org
          # Release builds are not reproducible from a warm cache, so skip it.
          package-manager-cache: false

      # pnpm >= 11.1.3 implements trusted publishing (OIDC) natively, and the
      # packageManager pin is 12.x; assert the major version once here.
      - name: Check pnpm supports trusted publishing
        run: |
          version="$(pnpm --version)"
          echo "node $(node -v), pnpm $version"
          major="${version%%.*}"
          if [ "$major" -lt 11 ]; then
            echo "::error::pnpm $version cannot do OIDC publishing — needs >= 11.1.3"
            exit 1
          fi

      # devDependencies supply esbuild and TypeScript; the prepare script builds
      # lib/ during install and again before pnpm publish.
      - name: Install build dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Check package.json version matches the release tag
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="${{ github.event.release.tag_name }}"
          if [ -n "$tag" ]; then
            tag="${tag#v}"
            if [ "$version" != "$tag" ]; then
              echo "::error::package.json says $version but the release tag is $tag — bump the version (or fix the tag) and release again"
              exit 1
            fi
          fi
          echo "publishing version $version"

      - name: Resolve dist-tag
        id: dist
        run: |
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then
            if [ "${{ github.event.release.prerelease }}" = "true" ]; then
              tag=next
            else
              tag=latest
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "will publish with --tag $tag"

      # No token is passed here. setup-node writes an .npmrc pointing at
      # ${NODE_AUTH_TOKEN} and exports a dummy value for it; pnpm 12 prefers the
      # OIDC exchange over that placeholder, so a real token would take over and
      # defeat the point. Provenance rides along with OIDC.
      # --no-git-checks: the release checkout is a detached tag and the tarball
      # has already passed the install/test/version gates above.
      - name: Publish to npm
        run: pnpm publish --tag "${{ steps.dist.outputs.tag }}" --no-git-checks
